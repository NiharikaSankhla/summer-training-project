<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>
    <style>
      body {
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;

    background: url("{{ url_for('static', filename='images/background.jpg') }}");
    background-size: cover;
    background-position: center;

    /* animation: zoomBackground 20s infinite alternate; */

    display: flex;
    justify-content: center;
    align-items: center;
}

/* @keyframes zoomBackground {
    from {
        background-size: 100%;
    }
    to {
        background-size: 115%;
    }
} */

.container {
    text-align: center;
    color: white;
    text-shadow: 2px 2px 5px black;
}

input, select {
    width: 250px;
    padding: 10px;
    margin: 8px;
    border-radius: 5px;
    border: none;
    background: rgba(255,255,255,0.8);
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

    </style>
</head>
<body>
<div class="container">
<h1>Titanic Survival Predictor</h1>

<form method="POST">

    <input type="number" name="Pclass" placeholder="Passenger Class (1-3)" required><br>

    <select name="Sex">
        <option value="0">Male</option>
        <option value="1">Female</option>
    </select><br>

    <input type="number" step="0.1" name="Age" placeholder="Age" required><br>

    <input type="number" name="SibSp" placeholder="Siblings/Spouse" required><br>

    <input type="number" name="Parch" placeholder="Parents/Children" required><br>

    <button type="submit">Predict</button>

</form>
{% if prediction_text %}
<h2>{{ prediction_text }}</h2>

<h3>Survival Probability: {{ survival_probability }}%</h3>

<h4>Model: {{ model_name }}</h4>
{% endif %}
</div>
</body>
</html>
